name: popl2027-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for the paper PDFs
        default: POPL2027-paper
        required: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Nix magic cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Build the PDFs
        run: nix build --print-build-logs .#default

      - name: Collect them
        run: |
          set -euo pipefail
          mkdir -p upload
          install -m 644 result/main.pdf upload/main.pdf
          install -m 644 result/supplement.pdf upload/supplement.pdf

      - name: Create or update the paper release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'POPL2027-paper' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber upload/main.pdf upload/supplement.pdf
          else
            gh release create "$TAG" \
              --title "POPL 2027: Bidirectional Type Slicing" \
              --notes 'The paper and its supplementary material (deferred rule sets and metatheory).' \
              upload/main.pdf upload/supplement.pdf
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
