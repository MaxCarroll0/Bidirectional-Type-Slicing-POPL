name: popl2027-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        default: POPL2027
        required: false

permissions:
  contents: write

jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Nix magic cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Build the PDFs
        run: nix build --print-build-logs .#default

      - name: Collect them
        run: |
          set -euo pipefail
          mkdir -p upload
          install -m 644 result/main.pdf upload/main.pdf
          install -m 644 result/supplement.pdf upload/supplement.pdf

      - name: Build the diff against the July 2026 submission
        run: |
          set -euo pipefail
          nix develop --command scripts/make-submission-diff.sh
          install -m 644 export/main-diff-vs-submission.pdf upload/main-diff-vs-submission.pdf

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'POPL2027' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber upload/*.pdf
          else
            gh release create "$TAG" --title "POPL 2027: Bidirectional Type Slicing" \
              --notes "Artefacts for *Bidirectional Type Slicing* (POPL 2027). The two tarballs are uploaded separately with scripts/build-artifacts.sh." \
              upload/*.pdf
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
